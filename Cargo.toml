[package]
name = "nebula"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.0", features = ["derive"] }
fs_extra = "1.3.0"
futures = "0.3"
heck = "0.5.0"
proc-macro2 = "1.0.103"
quote = "1.0.42"
prettyplease = "0.2.37"
syn = { version = "2.0.117", features = ["full", "parsing"] }
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.41"
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
walkdir = "2.5.0"
wit-bindgen-core = "0.54.0"
wit-bindgen-rust = "0.54.0"
wit-component = "0.245.1"
wit-parser = "0.245.1"
wasm-pkg-client = "0.15.0"
wasm-pkg-core = "0.15.0"
wac-cli = "0.9.0"
wac-graph = "0.9.0"
