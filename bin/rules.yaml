      - name: tracing3
        path: ./proxies/bin/tracing.wasm
  - before:
      interface: "nebula:demo/matcher"
    inject:
      - name: tracing5
        path: ./proxies/bin/tracing.wasm
  - before:
      interface: "nebula:demo/driver"
    inject:
      - name: tracing4
        path: ./proxies/bin/tracing.wasm
  - before:
      interface: "nebula:demo/payment"
    inject:
      - name: tracing6
        path: ./proxies/bin/tracing.wasm
